<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 9 Phase 4 词汇互动自习与测试系统</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* 顶部导航与模式切换 */
        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #334155;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
        }

        .tab-group {
            display: flex;
            gap: 8px;
            background: #1e293b;
            padding: 4px;
            border-radius: 12px;
        }

        .tab-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #0284c7;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
        }

        /* 错题数 Badge 标签 */
        .badge {
            background: #ef4444;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 4px;
        }

        /* 主界面容器 */
        main {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .view-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        /* 闪卡容器 */
        .flashcard-container {
            width: 100%;
            max-width: 480px;
            height: 280px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            border-color: #0284c7;
        }

        .card-hz {
            font-size: 42px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 12px;
        }

        .card-py {
            font-size: 22px;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-en {
            font-size: 17px;
            color: #cbd5e1;
        }

        .card-hint {
            position: absolute;
            bottom: 12px;
            font-size: 12px;
            color: #64748b;
        }

        /* 按钮与控制 */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 16px;
        }

        .btn {
            padding: 10px 18px;
            border: 1px solid #334155;
            border-radius: 12px;
            background: #1e293b;
            color: #f8fafc;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover:not(:disabled) {
            background: #334155;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-green {
            background: #15803d;
            border-color: #16a34a;
        }
        .btn-green:hover { background: #166534; }

        .btn-red {
            background: #b91c1c;
            border-color: #dc2626;
        }
        .btn-red:hover { background: #991b1b; }

        .btn-primary {
            background: #0284c7;
            border-color: #0284c7;
        }
        .btn-primary:hover { background: #0369a1; }

        .counter {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 600;
        }

        /* 测试模式卡片及布局 */
        .quiz-card {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .quiz-metrics {
            display: flex;
            gap: 16px;
            font-size: 14px;
            color: #38bdf8;
            font-weight: 600;
        }

        .question-box {
            background: #0f172a;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .question-hz {
            font-size: 34px;
            font-weight: 700;
            color: #f8fafc;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #0284c7;
            background: #1e293b;
        }

        .option-btn.correct {
            background: rgba(34, 197, 94, 0.15) !important;
            border-color: #22c55e !important;
            color: #4ade80 !important;
            font-weight: 700;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: #ef4444 !important;
            color: #f87171 !important;
        }

        .quiz-footer {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }

        /* 错题记事本面板 */
        .mistake-list {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 20px;
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .mistake-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
        }
        .mistake-item:last-child { border-bottom: none; }

        .mistake-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mistake-hz { font-size: 18px; font-weight: bold; color: #f8fafc; }
        .mistake-py { font-size: 14px; color: #38bdf8; }
        .mistake-en { font-size: 13px; color: #94a3b8; }

        /* 结算视图 */
        .result-box {
            text-align: center;
            padding: 32px 16px;
        }

        .score-display {
            font-size: 48px;
            font-weight: 800;
            color: #38bdf8;
            margin: 16px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Grade 9 Phase 4 词汇系统</h1>
        <div class="tab-group">
            <button class="tab-btn active" id="tabFlashcard">自习模式</button>
            <button class="tab-btn" id="tabMistakes">错题本 <span class="badge" id="mistakeBadge">0</span></button>
            <button class="tab-btn" id="tabQuiz">测试模式</button>
        </div>
    </header>

    <main>
        <!-- 1. 闪卡自习模式面板 -->
        <div class="view-panel" id="flashcardPanel">
            <div class="flashcard-container" id="cardContainer">
                <div class="flashcard" id="flashcard">
                    <div class="card-face card-front">
                        <div class="card-hz" id="fcHz">---</div>
                        <div class="card-hint">点击卡片翻面看释义</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="card-py" id="fcPy">---</div>
                        <div class="card-en" id="fcEn">---</div>
                        <div class="card-hint">点击可听标准朗读</div>
                    </div>
                </div>
            </div>

            <!-- 闪卡基本控制 -->
            <div class="controls">
                <button class="btn" id="prevCardBtn">上一词</button>
                <span class="counter" id="cardCounter">1 / 60</span>
                <button class="btn" id="nextCardBtn">下一词</button>
                <button class="btn btn-primary" id="speakBtn">🔊 朗读</button>
            </div>

            <!-- 自判与记错功能区 -->
            <div class="controls" style="margin-top: 8px;">
                <button class="btn btn-green" id="markKnownBtn">✓ 记得 / 认识</button>
                <button class="btn btn-red" id="markMistakeBtn">✗ 不记得 (加错题本)</button>
            </div>
        </div>

        <!-- 2. 错题本记事本面板 -->
        <div class="view-panel hidden" id="mistakePanel">
            <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3>记事本：复习与错题库 (<span id="mistakeCountText">0</span>)</h3>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-primary" id="reviewMistakesBtn">对错题进行闪卡练习</button>
                    <button class="btn" id="clearMistakesBtn">清空错题本</button>
                </div>
            </div>
            
            <div class="mistake-list" id="mistakeContainer"></div>
        </div>

        <!-- 3. 测试模式面板 -->
        <div class="view-panel hidden" id="quizPanel">
            <div class="quiz-card" id="quizCard">
                <div class="quiz-header">
                    <div class="quiz-metrics">
                        <span id="quizProgress">进度: 1 / 10</span>
                        <span id="quizTimer">用时: 00:00</span>
                        <span id="quizScore">得分: 0</span>
                    </div>
                    <button class="btn" id="soundToggleBtn">🔊 语音开</button>
                </div>

                <div class="question-box">
                    <div class="question-hz" id="quizQuestion">---</div>
                </div>

                <!-- 仅显示英文释义的选项网格 -->
                <div class="options-grid" id="optionsGrid"></div>

                <div class="quiz-footer">
                    <button class="btn btn-primary hidden" id="nextQuizBtn">下一题 ➔</button>
                </div>
            </div>

            <!-- 结算卡片 -->
            <div class="quiz-card hidden" id="resultCard">
                <div class="result-box">
                    <h2>测试完成！</h2>
                    <div class="score-display" id="scoreText">0%</div>
                    <p id="timeText" style="color:#38bdf8; font-weight: bold; margin-bottom: 8px;"></p>
                    <p id="resultSummary" style="color:#94a3b8; margin-bottom: 24px;"></p>
                    <button class="btn btn-primary" id="restartQuizBtn" style="margin: 0 auto;">重新开始新测试</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const vocabList = [
            { id: 1, hz: "擦身体", py: "cā shēntǐ", en: "to wipe the body down" },
            { id: 2, hz: "烧退了", py: "shāo tuì le", en: "the fever went down" },
            { id: 3, hz: "没力气", py: "méi lìqi", en: "to have no strength; feel weak" },
            { id: 4, hz: "头晕", py: "tóuyūn", en: "to feel dizzy" },
            { id: 5, hz: "脸色", py: "liǎnsè", en: "complexion" },
            { id: 6, hz: "症状", py: "zhèngzhuàng", en: "symptom" },
            { id: 7, hz: "听诊器", py: "tīngzhěnqì", en: "stethoscope" },
            { id: 8, hz: "检查", py: "jiǎnchá", en: "to examine; examination" },
            { id: 9, hz: "按时", py: "ànshí", en: "on time; at the prescribed time" },
            { id: 10, hz: "开病假条", py: "kāi bìngjiàtiáo", en: "to issue a sick-leave note" },
            { id: 11, hz: "功课落后", py: "gōngkè luòhòu", en: "to fall behind in schoolwork" },
            { id: 12, hz: "生活习惯", py: "shēnghuó xíguàn", en: "lifestyle habits" },
            { id: 13, hz: "油炸的东西", py: "yóuzhá de dōngxi", en: "fried food" },
            { id: 14, hz: "锻炼身体", py: "duànliàn shēntǐ", en: "to exercise; keep fit" },
            { id: 15, hz: "病房", py: "bìngfáng", en: "hospital ward" },
            { id: 16, hz: "忙个不停", py: "máng ge bù tíng", en: "to be busy nonstop" },
            { id: 17, hz: "安慰", py: "ānwèi", en: "to comfort; reassure" },
            { id: 18, hz: "康复出院", py: "kāngfù chūyuàn", en: "to recover and be discharged from hospital" },
            { id: 19, hz: "成就感", py: "chéngjiùgǎn", en: "sense of achievement" },
            { id: 20, hz: "摔伤", py: "shuāishāng", en: "to injure oneself in a fall" },
            { id: 21, hz: "痛苦的表情", py: "tòngkǔ de biǎoqíng", en: "an expression of pain" },
            { id: 22, hz: "骨折", py: "gǔzhé", en: "bone fracture" },
            { id: 23, hz: "扭伤", py: "niǔshāng", en: "sprain" },
            { id: 24, hz: "打石膏", py: "dǎ shígāo", en: "to put on a cast" },
            { id: 25, hz: "冰敷", py: "bīngfū", en: "to apply an ice pack; ice treatment" },
            { id: 26, hz: "抬高", py: "táigāo", en: "to raise; elevate" },
            { id: 27, hz: "主动", py: "zhǔdòng", en: "voluntarily; take the initiative" },
            { id: 28, hz: "懂事", py: "dǒngshì", en: "sensible; considerate" },
            { id: 29, hz: "欣慰", py: "xīnwèi", en: "relieved and pleased" },
            { id: 30, hz: "书呆子", py: "shūdāizi", en: "bookworm (sometimes teasing/negative)" },
            { id: 31, hz: "外貌", py: "wàimào", en: "appearance" },
            { id: 32, hz: "老成", py: "lǎochéng", en: "mature-looking; older than one’s age" },
            { id: 33, hz: "在意", py: "zàiyì", en: "to care about; mind" },
            { id: 34, hz: "隐形眼镜", py: "yǐnxíng yǎnjìng", en: "contact lenses" },
            { id: 35, hz: "又干又痛", py: "yòu gān yòu tòng", en: "dry and painful" },
            { id: 36, hz: "发炎", py: "fāyán", en: "to become inflamed; inflammation" },
            { id: 37, hz: "叮嘱", py: "dīngzhǔ", en: "to urge; remind carefully" },
            { id: 38, hz: "眼药水", py: "yǎnyàosuǐ", en: "eye drops" },
            { id: 39, hz: "自卑", py: "zìbēi", en: "to feel inferior; lack confidence" },
            { id: 40, hz: "接受自己", py: "jiēshòu zìjǐ", en: "to accept oneself" },
            { id: 41, hz: "节俭", py: "jiéjiǎn", en: "thrifty; frugal" },
            { id: 42, hz: "预约", py: "yùyuē", en: "to make an appointment" },
            { id: 43, hz: "做检查", py: "zuò jiǎnchá", en: "to have a medical check-up/examination" },
            { id: 44, hz: "治疗", py: "zhìliáo", en: "to treat; treatment" },
            { id: 45, hz: "连续", py: "liánxù", en: "continuously; in a row" },
            { id: 46, hz: "坚持", py: "jiānchí", en: "to persist; insist on" },
            { id: 47, hz: "强行", py: "qiángxíng", en: "forcibly; against someone’s wishes" },
            { id: 48, hz: "肺炎", py: "fèiyán", en: "pneumonia" },
            { id: 49, hz: "态度", py: "tàidù", en: "attitude" },
            { id: 50, hz: "道理", py: "dàolǐ", en: "reason; principle; lesson" },
            { id: 51, hz: "推测", py: "tuīcè", en: "to infer; speculate" },
            { id: 52, hz: "表达", py: "biǎodá", en: "to express" },
            { id: 53, hz: "教训", py: "jiàoxun", en: "lesson learned from experience" },
            { id: 54, hz: "观点", py: "guāndiǎn", en: "viewpoint; opinion" },
            { id: 55, hz: "意味着", py: "yìwèizhe", en: "to mean; signify" },
            { id: 56, hz: "主要意思", py: "zhǔyào yìsi", en: "main idea" },
            { id: 57, hz: "从文章中可以推测", py: "cóng wénzhāng zhōng kěyǐ tuīcè", en: "it can be inferred from the text" },
            { id: 58, hz: "表达的观点", py: "biǎodá de guāndiǎn", en: "the viewpoint being expressed" },
            { id: 59, hz: "预防", py: "yùfáng", en: "to prevent; prevention" },
            { id: 60, hz: "重视", py: "zhòngshì", en: "to attach importance to; take seriously" }
        ];

        let currentDeck = [...vocabList];
        let fcIndex = 0;
        let mistakes = [];

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'zh-CN';
                window.speechSynthesis.speak(u);
            }
        }

        const flashcard = document.getElementById('flashcard');
        const fcHz = document.getElementById('fcHz');
        const fcPy = document.getElementById('fcPy');
        const fcEn = document.getElementById('fcEn');
        const cardCounter = document.getElementById('cardCounter');

        function updateFlashcard() {
            flashcard.classList.remove('flipped');
            if (currentDeck.length === 0) {
                fcHz.textContent = "暂无词汇";
                fcPy.textContent = "";
                fcEn.textContent = "";
                cardCounter.textContent = "0 / 0";
                return;
            }
            const item = currentDeck[fcIndex];
            fcHz.textContent = item.hz;
            fcPy.textContent = item.py;
            fcEn.textContent = item.en;
            cardCounter.textContent = `${fcIndex + 1} / ${currentDeck.length}`;
        }

        document.getElementById('cardContainer').addEventListener('click', () => {
            if (currentDeck.length === 0) return;
            flashcard.classList.toggle('flipped');
            if (flashcard.classList.contains('flipped')) {
                speak(currentDeck[fcIndex].hz);
            }
        });

        document.getElementById('prevCardBtn').addEventListener('click', () => {
            if (currentDeck.length === 0) return;
            fcIndex = (fcIndex - 1 + currentDeck.length) % currentDeck.length;
            updateFlashcard();
        });

        document.getElementById('nextCardBtn').addEventListener('click', () => {
            if (currentDeck.length === 0) return;
            fcIndex = (fcIndex + 1) % currentDeck.length;
            updateFlashcard();
        });

        document.getElementById('speakBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentDeck.length > 0) speak(currentDeck[fcIndex].hz);
        });

        document.getElementById('markKnownBtn').addEventListener('click', () => {
            if (currentDeck.length === 0) return;
            fcIndex = (fcIndex + 1) % currentDeck.length;
            updateFlashcard();
        });

        document.getElementById('markMistakeBtn').addEventListener('click', () => {
            if (currentDeck.length === 0) return;
            const currentItem = currentDeck[fcIndex];
            if (!mistakes.some(m => m.id === currentItem.id)) {
                mistakes.push(currentItem);
                updateMistakeUI();
            }
            fcIndex = (fcIndex + 1) % currentDeck.length;
            updateFlashcard();
        });

        function updateMistakeUI() {
            document.getElementById('mistakeBadge').textContent = mistakes.length;
            document.getElementById('mistakeCountText').textContent = mistakes.length;
            const container = document.getElementById('mistakeContainer');
            container.innerHTML = '';

            if (mistakes.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">错题本为空，太棒了！</p>';
                return;
            }

            mistakes.forEach(item => {
                const div = document.createElement('div');
                div.className = 'mistake-item';
                div.innerHTML = `
                    <div class="mistake-info">
                        <span class="mistake-hz">${item.hz}</span>
                        <span class="mistake-py">${item.py}</span>
                        <span class="mistake-en">${item.en}</span>
                    </div>
                    <button class="btn" onclick="removeMistake(${item.id})">移除</button>
                `;
                container.appendChild(div);
            });
        }

        window.removeMistake = function(id) {
            mistakes = mistakes.filter(m => m.id !== id);
            updateMistakeUI();
        };

        document.getElementById('clearMistakesBtn').addEventListener('click', () => {
            mistakes = [];
            updateMistakeUI();
        });

        document.getElementById('reviewMistakesBtn').addEventListener('click', () => {
            if (mistakes.length === 0) {
                alert("错题本为空！");
                return;
            }
            currentDeck = [...mistakes];
            fcIndex = 0;
            switchTab('flashcard');
            updateFlashcard();
        });

        const tabFlashcard = document.getElementById('tabFlashcard');
        const tabMistakes = document.getElementById('tabMistakes');
        const tabQuiz = document.getElementById('tabQuiz');
        const flashcardPanel = document.getElementById('flashcardPanel');
        const mistakePanel = document.getElementById('mistakePanel');
        const quizPanel = document.getElementById('quizPanel');

        function switchTab(tabName) {
            [tabFlashcard, tabMistakes, tabQuiz].forEach(t => t.classList.remove('active'));
            [flashcardPanel, mistakePanel, quizPanel].forEach(p => p.classList.add('hidden'));

            if (tabName === 'flashcard') {
                tabFlashcard.classList.add('active');
                flashcardPanel.classList.remove('hidden');
            } else if (tabName === 'mistakes') {
                tabMistakes.classList.add('active');
                mistakePanel.classList.remove('hidden');
                updateMistakeUI();
            } else if (tabName === 'quiz') {
                tabQuiz.classList.add('active');
                quizPanel.classList.remove('hidden');
                initQuiz();
            }
        }

        tabFlashcard.addEventListener('click', () => {
            currentDeck = [...vocabList];
            switchTab('flashcard');
            updateFlashcard();
        });
        tabMistakes.addEventListener('click', () => switchTab('mistakes'));
        tabQuiz.addEventListener('click', () => switchTab('quiz'));

        let quizQuestions = [];
        let currentQuizIndex = 0;
        let score = 0;
        let isSoundOn = true;
        let timerInterval = null;
        let secondsElapsed = 0;

        const soundToggleBtn = document.getElementById('soundToggleBtn');
        soundToggleBtn.addEventListener('click', () => {
            isSoundOn = !isSoundOn;
            soundToggleBtn.textContent = isSoundOn ? "🔊 语音开" : "🔇 语音关";
        });

        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('quizTimer').textContent = `用时: ${mins}:${secs}`;
        }

        function initQuiz() {
            const shuffled = [...vocabList].sort(() => 0.5 - Math.random());
            quizQuestions = shuffled.slice(0, 10);
            currentQuizIndex = 0;
            score = 0;

            document.getElementById('quizCard').classList.remove('hidden');
            document.getElementById('resultCard').classList.add('hidden');
            document.getElementById('quizScore').textContent = `得分: ${score}`;
            
            startTimer();
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const current = quizQuestions[currentQuizIndex];
            document.getElementById('quizProgress').textContent = `进度: ${currentQuizIndex + 1} / ${quizQuestions.length}`;
            document.getElementById('quizQuestion').textContent = current.hz;

            if (isSoundOn) {
                speak(current.hz);
            }

            let distractors = vocabList.filter(item => item.hz !== current.hz);
            distractors = distractors.sort(() => 0.5 - Math.random()).slice(0, 3);
            const options = [...distractors, current].sort(() => 0.5 - Math.random());

            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            document.getElementById('nextQuizBtn').classList.add('hidden');

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.en;
                btn.addEventListener('click', () => handleOptionClick(btn, opt, current));
                optionsGrid.appendChild(btn);
            });
        }

        function handleOptionClick(selectedBtn, selectedOpt, correctOpt) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedOpt.hz === correctOpt.hz) {
                selectedBtn.classList.add('correct');
                score += 10;
                document.getElementById('quizScore').textContent = `得分: ${score}`;
            } else {
                selectedBtn.classList.add('wrong');
                buttons.forEach(btn => {
                    if (btn.textContent === correctOpt.en) {
                        btn.classList.add('correct');
                    }
                });
                if (!mistakes.some(m => m.id === correctOpt.id)) {
                    mistakes.push(correctOpt);
                    updateMistakeUI();
                }
            }

            document.getElementById('nextQuizBtn').classList.remove('hidden');
        }

        document.getElementById('nextQuizBtn').addEventListener('click', () => {
            currentQuizIndex++;
            if (currentQuizIndex < quizQuestions.length) {
                renderQuizQuestion();
            } else {
                finishQuiz();
            }
        });

        function finishQuiz() {
            clearInterval(timerInterval);
            document.getElementById('quizCard').classList.add('hidden');
            document.getElementById('resultCard').classList.remove('hidden');

            const percentage = Math.round((score / (quizQuestions.length * 10)) * 100);
            document.getElementById('scoreText').textContent = `${percentage}%`;
            
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('timeText').textContent = `总耗时: ${mins} 分 ${secs} 秒`;
            document.getElementById('resultSummary').textContent = `您一共获得 ${score} 分（答对 ${score/10} / ${quizQuestions.length} 题）`;
        }

        document.getElementById('restartQuizBtn').addEventListener('click', initQuiz);

        updateFlashcard();
    </script>
</body>
</html>
